<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="KONIK이 서커스 무대를 달리고, 부캉이와 바다를 헤엄치는 러너 게임">
<title>KONIK 서커스 런</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: a single toy-circus stage (16:9 canvas) on a dark theatre ground, title bar above, cast & controls below */
:root{
  --ground:#25122b;
  --ground-2:#371a3c;
  --cream:#fff4e6;
  --muted:#d9bfd0;
  --gold:#f2c14e;
  --rose:#ef8fa6;
  --teal:#2bb3ad;
  --font-display:"Jua","Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --font-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html{height:100%}
body{min-height:100%}
.bar,.stage,.cast{flex-shrink:0}
[hidden]{display:none!important}
body{
  background:var(--ground);
  background-image:radial-gradient(120% 70% at 50% 0%,var(--ground-2),var(--ground) 70%);
  color:var(--cream);font-family:var(--font-body);
  margin:0;box-sizing:border-box;padding-inline:16px;padding-block:14px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
}
.bar,.stage,.cast{width:min(100%,1180px,calc((100vh - 210px) * 16 / 9));}
@supports (height:100dvh){.bar,.stage,.cast{width:min(100%,1180px,calc((100dvh - 210px) * 16 / 9));}}
.bar,.stage,.cast{min-width:min(100%,320px)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(22px,3.2vw,34px);margin:0;letter-spacing:.01em;color:var(--gold);text-wrap:balance}
h1 small{font-family:var(--font-body);font-size:.45em;color:var(--muted);letter-spacing:.12em;margin-left:.6em;vertical-align:middle}
.tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.best{font-size:14px;color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}
.best b{font-family:var(--font-display);font-weight:400;color:var(--cream);font-size:18px;margin-left:4px}
.tbtn{font:inherit;font-size:13px;color:var(--cream);background:rgba(255,244,230,.08);border:1px solid rgba(255,244,230,.22);border-radius:999px;padding:6px 12px;cursor:pointer}
.tbtn:hover{background:rgba(255,244,230,.16)}
.tbtn:focus-visible,.go:focus-visible,.skin:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.stage{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:18px;overflow:hidden;
  box-shadow:0 0 0 6px #4a2140,0 0 0 8px #f2c14e55,0 24px 60px rgba(0,0,0,.45);container-type:inline-size;background:#ef8fa6}
canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer}
.ovl{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(closest-side,rgba(37,18,43,.55),rgba(37,18,43,.78));text-align:center;padding:4cqw}
.card{display:flex;flex-direction:column;align-items:center;gap:1.4cqw;max-width:70cqw}
.eyebrow{margin:0;font-size:max(11px,1.5cqw);letter-spacing:.22em;color:var(--gold)}
.ovl h2{font-family:var(--font-display);font-weight:400;margin:0;font-size:clamp(22px,7cqw,76px);line-height:1;color:var(--cream);
  text-shadow:0 .5cqw 0 #c2415b,0 1cqw 0 rgba(0,0,0,.25);text-wrap:balance}
.ovl p{margin:0;font-size:max(12px,1.9cqw);color:var(--cream);line-height:1.45}
.ovl .big{font-family:var(--font-display);font-size:clamp(28px,6cqw,64px);color:var(--gold);line-height:1;font-variant-numeric:tabular-nums}
.ovl .sub{color:var(--muted);font-variant-numeric:tabular-nums}
.go{font-family:var(--font-display);font-size:clamp(16px,2.8cqw,30px);color:#3a1530;background:var(--gold);border:0;border-radius:999px;
  padding:.45em 1.4em;cursor:pointer;box-shadow:0 .25em 0 #b47d1c;margin-top:.6cqw}
.go:hover{filter:brightness(1.06)}
.go:active{transform:translateY(.15em);box-shadow:0 .1em 0 #b47d1c}
.row{display:flex;gap:2cqw;flex-wrap:wrap;justify-content:center;align-items:center}
.go.ghost{background:transparent;color:var(--cream);box-shadow:inset 0 0 0 2px rgba(255,244,230,.5)}
*{-webkit-tap-highlight-color:transparent}
button{touch-action:manipulation}
.stage,canvas{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.fbtn{display:none}
/* phone play mode: the stage takes the whole screen, letterboxed to 16:9 */
body.playing{overflow:hidden;touch-action:none}
body.playing .bar,body.playing .cast{display:none}
body.playing .stage{position:fixed;inset:0;width:100%;height:100%;min-width:0;max-width:none;aspect-ratio:auto;border-radius:0;box-shadow:none;
  background:var(--ground);display:flex;align-items:center;justify-content:center;z-index:10;box-sizing:border-box;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
body.playing canvas{height:auto;aspect-ratio:16/9;width:min(100%,calc(100vh * 16 / 9))}
@supports (height:100dvh){body.playing canvas{width:min(100%,calc((100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)) * 16 / 9))}}
body.playing .fbtn{display:block;position:absolute;right:calc(env(safe-area-inset-right,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:2;
  font:inherit;font-size:13px;color:var(--cream);background:rgba(37,18,43,.6);border:1px solid rgba(255,244,230,.35);border-radius:999px;padding:8px 14px}
/* held upright: turn the stage sideways so the phone just needs turning, even with rotation lock on */
@media (orientation:portrait){
  body.playing .stage{inset:auto;top:50%;left:50%;width:100vh;height:100vw;padding:0;transform:translate(-50%,-50%) rotate(90deg)}
  body.playing canvas{width:min(100%,calc(100vw * 16 / 9))}
}
@supports (height:100dvh){@media (orientation:portrait){body.playing .stage{width:100dvh}}}
.hint{font-size:max(11px,1.5cqw)!important;color:var(--muted)!important}

.cast{display:grid;grid-template-columns:auto 1fr;gap:16px 24px;align-items:center}
.cast h3{margin:0 0 6px;font-family:var(--font-display);font-weight:400;font-size:15px;color:var(--gold);letter-spacing:.04em}
.skins{display:flex;gap:8px;flex-wrap:wrap}
.skin{display:flex;flex-direction:column;align-items:center;gap:2px;font:inherit;font-size:12px;color:var(--cream);background:rgba(255,244,230,.06);
  border:2px solid transparent;border-radius:12px;padding:4px 6px 6px;cursor:pointer}
.skin canvas{width:78px;height:56px;border-radius:8px;cursor:inherit}
.skin[aria-pressed="true"]{border-color:var(--gold);background:rgba(242,193,78,.12)}
.keys{min-width:0;display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--muted);line-height:1.5}
.keys span b{color:var(--cream);font-weight:400;font-family:var(--font-display);font-size:14px;margin-right:4px}
@media (max-width:620px){.cast{grid-template-columns:1fr}}
</style>
</head>
<body>


<header class="bar">
  <h1>KONIK 서커스 런<small>PROTOTYPE 1</small></h1>
  <div class="tools">
    <span class="best">최고 기록<b id="best">0</b></span>
    <button class="tbtn" id="bgm" type="button">음악 켜짐</button>
    <button class="tbtn" id="snd" type="button">효과음 켜짐</button>
    <button class="tbtn" id="pauseBtn" type="button">일시정지</button>
  </div>
</header>

<div class="stage" id="stage">
  <canvas id="game" aria-label="KONIK 서커스 런 게임 화면"></canvas>
  <div class="ovl" id="ovl"><div class="card" id="card"></div></div>
  <button class="fbtn" id="fpause" type="button">일시정지</button>
</div>

<section class="cast">
  <div>
    <h3>오늘의 코닉</h3>
    <div class="skins" id="skins"></div>
  </div>
  <div class="keys">
    <span><b>점프</b>스페이스 · ↑ · 화면 탭</span>
    <span><b>높이 점프</b>길게 누르기</span>
    <span><b>2단 점프</b>공중에서 한 번 더</span>
    <span><b>물속</b>누르면 위로, 떼면 아래로</span>
    <span><b>일시정지</b>P</span>
    <span><b>사자</b>무조건 넘어가기</span>
    <span><b>늑대</b>밟으면 +100</span>
    <span><b>달팽이</b>밟으면 −50</span>
    <span><b>먹이</b>링 10 · 당근 30 · 수박 60</span>
  </div>
</section>

<script>
(()=>{
"use strict";
const W=960,H=540,GROUND=448,SURF=62,FLOOR=505;
const cv=document.getElementById('game'),ctx=cv.getContext('2d');
const ovl=document.getElementById('ovl'),card=document.getElementById('card');
const bestEl=document.getElementById('best'),sndBtn=document.getElementById('snd'),pauseBtn=document.getElementById('pauseBtn');
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const FONT='"Jua","Gowun Dodum",sans-serif';

/* ---------- storage ---------- */
function load(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let best=load('konik.best',0),skin=load('konik.skin','patch'),muted=load('konik.muted',false);
bestEl.textContent=best;

/* ---------- color utils ---------- */
const hex=h=>{const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]};
const rgb=(a,al=1)=>`rgba(${a[0]|0},${a[1]|0},${a[2]|0},${al})`;
const mix=(a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
const rand=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const CREAM=hex('#fff4e6');
const SECTION_BG=[hex('#f19bb0'),hex('#2fb0a8'),hex('#8ccbe4')];

/* ---------- KONIK drawing (unit space: feet at y=0, facing right) ---------- */
const HP=[[10,-60],[60,-60],[74,-56],[81,-44],[82,-30],[80,-26],[66,-28],[30,-28],[14,-26],[11,-30],[8,-40],[8,-56]];
// head + neck piece, nods around the base of the neck
const NECK=[[50,-57],[57,-97],[62,-111],[68,-99],[90,-86],[95,-78],[91,-71],[77,-71],[72,-65],[81,-44],[77,-36],[56,-40]];
const NECK_PIVOT=[64,-48];
const LEG=[[-6.5,0],[6.5,0],[6,34],[-6,34]]; // leg in local space: pivot at hip, foot at y=34
const LEG_PIVOTS={bi:[24,-34],fi:[80,-34],bo:[19,-34],fo:[75,-34]};
const MANE=[[51,-57],[44,-70],[45,-88],[51,-104],[60,-113],[63,-101],[57,-97],[53,-61]];
const TAIL=[[11,-58],[2,-55],[-6,-42],[-9,-24],[-5,-14],[-1,-24],[3,-38],[10,-47]];
const MUZZLE=[[86,-88],[97,-78],[92,-69],[83,-72]];
const shape=(c,p)=>{c.beginPath();p.forEach(([x,y],i)=>i?c.lineTo(x,y):c.moveTo(x,y));c.closePath()};
const PATCH=['#f6c3d1','#2f5fae','#e0709c','#8a7cc4','#4f9d5b','#ef8a2c','#c9a24a','#f2a7bd','#6d5fb0','#2a6fb8','#e98a4a','#5aa66a'];
const STRIPES=['#e8728f','#2f74c9','#f6b6c8','#1c1418','#2f74c9','#9a88cc','#ef8a2c','#8fcbe8','#4f9d5b','#d9472f','#1c1418','#f2a7bd','#3aa35a','#8fcbe8','#f2c230','#d9472f'];
const SPOTS=[[20,-46,10,7],[43,-48,11,7],[63,-38,7,6],[33,-36,5,4],[70,-82,6,8],[79,-95,4,5],[52,-73,4,4],[19,-13,4,6],[75,-16,5,7],[87,-80,4,4],[60,-55,5,4],[13,-50,4,4]];
function maneGoldBlack(c){c.fillStyle='#1c1418';c.fillRect(-15,-120,90,125);c.save();c.translate(40,-70);c.rotate(-.7);c.fillStyle='#c9a24a';for(let y=-80;y<80;y+=13)c.fillRect(-80,y,160,6);c.restore()}
function maneFlow(base,line){return c=>{c.fillStyle=base;c.fillRect(-15,-120,90,125);c.strokeStyle=line;c.lineWidth=1.6;for(let i=0;i<7;i++){c.beginPath();c.moveTo(40+i*3,-118);c.quadraticCurveTo(36+i*3,-80,-10+i*4,-10);c.stroke()}}}
const SKINS={
  patch:{name:'패치워크',inner:'#5a3f7a',muzzle:true,mane:maneGoldBlack,bg:'#ef8fa6',
    body(c){c.fillStyle='#f2a7bd';c.fillRect(-12,-120,115,122);const xs=[-12,22,45,64,100],ys=[-120,-84,-56,-29,2];let k=0;
      for(let i=0;i<4;i++)for(let j=0;j<4;j++){const x1=xs[i],x2=xs[i+1],y1=ys[j],y2=ys[j+1],f=(i+j)%2;
        c.fillStyle=PATCH[(k*5+3)%12];c.beginPath();if(f){c.moveTo(x1,y1);c.lineTo(x2,y1);c.lineTo(x1,y2)}else{c.moveTo(x1,y1);c.lineTo(x2,y1);c.lineTo(x2,y2)}c.closePath();c.fill();
        c.fillStyle=PATCH[(k*7+8)%12];c.beginPath();if(f){c.moveTo(x2,y1);c.lineTo(x2,y2);c.lineTo(x1,y2)}else{c.moveTo(x1,y1);c.lineTo(x2,y2);c.lineTo(x1,y2)}c.closePath();c.fill();k++}}},
  stripe:{name:'스트라이프',inner:'#7a3b2a',muzzle:true,mane:maneFlow('#d8b25c','#b88a34'),bg:'#1fa6a0',
    body(c){let i=0;for(let x=-12;x<104;x+=7.2)c.fillStyle=STRIPES[i++%STRIPES.length],c.fillRect(x,-120,7.4,122)}},
  spot:{name:'스팟',inner:'#5fae9f',muzzle:false,mane:maneFlow('#f2d33b','#d9b51f'),bg:'#86c3de',
    body(c){c.fillStyle='#93dccb';c.fillRect(-12,-120,115,122);c.fillStyle='#ef7a2c';for(const[x,y,a,b]of SPOTS){c.beginPath();c.ellipse(x,y,a,b,.4,0,7);c.fill()}}}
};
function drawHorse(c,x,y,s,key,rot=0,o={}){
  const sk=SKINS[key];c.save();c.translate(x,y);c.scale(s,s);
  if(rot){c.translate(46,-50);c.rotate(rot);c.translate(-46,50)}
  if(o.alpha!=null)c.globalAlpha=o.alpha;
  const L=o.legs||{};
  const leg=(k,dark)=>{const[px,py]=LEG_PIVOTS[k],a=L[k]||0;c.save();c.translate(px,py);c.rotate(a);shape(c,LEG);c.save();c.clip();
    c.save();c.rotate(-a);c.translate(-px,-py);sk.body(c);c.restore();
    if(dark){c.fillStyle='rgba(30,10,30,.38)';c.fillRect(-8,-2,16,40)}
    c.fillStyle='#1c1418';c.fillRect(-8,27,16,9);c.restore();c.restore()};
  leg('bi',true);leg('fi',true);
  shape(c,TAIL);c.save();c.clip();sk.mane(c);c.restore();
  leg('bo',false);leg('fo',false);
  const ha=o.head!=null?o.head:(L.head||0),[nx,ny]=NECK_PIVOT;
  const headT=()=>{c.translate(nx,ny);c.rotate(ha);c.translate(-nx,-ny)};
  const shade=()=>{const g=c.createLinearGradient(0,-112,0,0);g.addColorStop(0,'rgba(255,255,255,.2)');g.addColorStop(.5,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,0,0,.16)');c.fillStyle=g;c.fillRect(-12,-120,115,122)};
  if(o.glow!=null){c.lineJoin='round';c.lineWidth=10;c.strokeStyle=`hsl(${o.glow},95%,66%)`;shape(c,HP);c.stroke();c.save();headT();shape(c,NECK);c.stroke();shape(c,MANE);c.stroke();c.restore()}
  shape(c,HP);c.save();c.clip();sk.body(c);shade();c.restore();
  c.save();headT();
  shape(c,NECK);c.save();c.clip();sk.body(c);if(sk.muzzle){c.fillStyle='#1c1418';shape(c,MUZZLE);c.fill()}shade();c.restore();
  shape(c,MANE);c.save();c.clip();sk.mane(c);c.restore();
  c.restore();
  c.restore();
}

// gallop cycle: positive angle swings a foot backward, negative reaches forward
// head dips as the front feet land and lifts as they reach forward
function gait(ph,amp=1){const s=Math.sin;return{fo:-s(ph)*.62*amp,fi:-s(ph+.75)*.62*amp,bo:s(ph+2.3)*.6*amp,bi:s(ph+3.05)*.6*amp,head:s(ph+1.1)*.1*amp}}
const AIR_POSE={fo:-.75,fi:-.5,bo:.7,bi:.5,head:-.12};
function easeLegs(cur,tgt,k){for(const n in tgt)cur[n]=(cur[n]||0)+(tgt[n]-(cur[n]||0))*k}

/* ---------- BUKANGI drawing (unit space, centered, facing right) ---------- */
function sharkBody(c){c.beginPath();c.moveTo(100,4);c.bezierCurveTo(99,-30,52,-44,0,-41);c.bezierCurveTo(-45,-37,-76,-18,-92,-5);c.lineTo(-92,6);c.bezierCurveTo(-70,25,-30,37,10,38);c.bezierCurveTo(62,40,101,30,100,4);c.closePath()}
function drawShark(c,x,y,s,t,rot,rider){
  const teal='#2bb3ad',dk='#1f9792';c.save();c.translate(x,y);c.rotate(rot);c.scale(s,s);
  c.save();c.translate(-88,0);c.rotate(Math.sin(t*9)*.28);c.fillStyle=dk;c.beginPath();c.moveTo(6,-5);c.quadraticCurveTo(-18,-22,-40,-46);c.quadraticCurveTo(-27,-14,-23,0);c.quadraticCurveTo(-29,17,-38,36);c.quadraticCurveTo(-16,20,6,7);c.closePath();c.fill();c.restore();
  c.fillStyle=teal;c.beginPath();c.moveTo(-36,-33);c.quadraticCurveTo(-44,-58,-58,-78);c.quadraticCurveTo(-24,-68,-6,-39);c.closePath();c.fill();
  if(rider)rider(c);
  c.fillStyle=teal;sharkBody(c);c.fill();
  c.save();sharkBody(c);c.clip();c.fillStyle='#f3fbfa';c.beginPath();c.ellipse(22,41,92,30,0,0,7);c.fill();c.beginPath();c.ellipse(86,20,28,19,-.35,0,7);c.fill();
  const g=c.createLinearGradient(0,-44,0,40);g.addColorStop(0,'rgba(255,255,255,.22)');g.addColorStop(.45,'rgba(255,255,255,0)');g.addColorStop(1,'rgba(0,40,40,.12)');c.fillStyle=g;c.fillRect(-100,-50,210,95);c.restore();
  c.strokeStyle=dk;c.lineWidth=3;c.lineCap='round';for(let i=0;i<3;i++){c.beginPath();c.moveTo(30+i*7,-10);c.quadraticCurveTo(25+i*7,2,29+i*7,13);c.stroke()}
  c.fillStyle='#fff';c.beginPath();c.arc(66,-13,9.5,0,7);c.fill();c.fillStyle='#1d2b3a';c.beginPath();c.arc(68,-13,6.4,0,7);c.fill();c.fillStyle='#fff';c.beginPath();c.arc(70.5,-15.5,2.3,0,7);c.fill();
  c.strokeStyle='#1d5f5c';c.lineWidth=2.8;c.beginPath();c.moveTo(97,9);c.quadraticCurveTo(84,22,66,16);c.stroke();
  c.fillStyle='rgba(239,120,150,.35)';c.beginPath();c.ellipse(74,6,7,4,0,0,7);c.fill();
  c.fillStyle=dk;c.save();c.translate(30,22);c.rotate(.3+Math.sin(t*6)*.22);c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-8,22,-26,34);c.quadraticCurveTo(4,24,15,4);c.closePath();c.fill();c.restore();
  c.restore();
}

/* ---------- audio ---------- */
let AC=null;
function getAC(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function audio(){if(muted)return null;if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(AC.state==='suspended')AC.resume();return AC}
function tone(f1,f2,dur,type='square',vol=.06,delay=0){const a=audio();if(!a)return;const t=a.currentTime+delay,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0005,t+dur);o.connect(g).connect(a.destination);o.start(t);o.stop(t+dur+.02)}
function noise(dur,vol,freq){const a=audio();if(!a)return;const b=a.createBuffer(1,a.sampleRate*dur,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=freq;g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start()}
const SFX={
  jump:()=>tone(380,720,.13,'square',.045),dj:()=>tone(620,1150,.12,'square',.04),
  ring:()=>{tone(1320,1320,.07,'sine',.07);tone(1760,1760,.12,'sine',.06,.06)},
  pearl:()=>tone(900,1400,.12,'triangle',.07),
  fire:()=>{[523,659,784,1046].forEach((f,i)=>tone(f,f,.1,'triangle',.07,i*.06))},
  hit:()=>{tone(220,70,.28,'sawtooth',.07);noise(.18,.25,600)},smash:()=>{noise(.15,.3,1200);tone(300,120,.12,'square',.05)},
  stomp:()=>{tone(300,900,.14,'square',.06);tone(900,1300,.08,'triangle',.05,.1)},
  boo:()=>{tone(420,300,.18,'sawtooth',.05);tone(300,150,.3,'sawtooth',.05,.18)},
  roar:()=>{tone(140,70,.5,'sawtooth',.06);noise(.45,.35,260)},
  crunch:()=>{noise(.08,.35,2400);tone(700,1100,.1,'triangle',.06,.04)},
  melon:()=>{noise(.12,.3,1500);[784,988,1318].forEach((f,i)=>tone(f,f,.1,'sine',.07,.05+i*.06))},
  splash:()=>{noise(.5,.5,900);tone(600,180,.35,'sine',.05)},
  star:()=>{[523,659,784,1046,1318].forEach((f,i)=>tone(f,f*1.01,.12,'square',.04,i*.07))},
  heart:()=>{tone(660,660,.1,'sine',.07);tone(990,990,.16,'sine',.07,.09)},
  shark:()=>{[392,494,587,784].forEach((f,i)=>tone(f,f,.14,'triangle',.07,i*.09))},
  over:()=>{[523,415,349,262].forEach((f,i)=>tone(f,f*.98,.22,'triangle',.07,i*.16))}
};
const sfx=k=>{if(!muted)SFX[k]&&SFX[k]()};

/* ---------- background music ----------
   Melody: "Korobeiniki" (Russian folk song, 1861, public domain) — the tune Tetris made famous.
   Arrangement here is our own circus "oom-pah" version. Times are in eighth notes; 64 eighths = 8 bars. */
const MEL_SRC=[[76,2],[71,1],[72,1],[74,2],[72,1],[71,1],[69,2],[69,1],[72,1],[76,2],[74,1],[72,1],[71,3],[72,1],[74,2],[76,2],[72,2],[69,2],[69,2],[0,2],
  [0,1],[74,2],[77,1],[81,2],[79,1],[77,1],[76,3],[72,1],[76,2],[74,1],[72,1],[71,2],[71,1],[72,1],[74,2],[76,2],[72,2],[69,2],[69,2],[0,2]];
const MEL=[];{let i=0;for(const[n,d]of MEL_SRC){if(n)MEL[i]=[n,d];i+=d}}
const BASS=[[40,47],[45,52],[40,47],[45,52],[50,57],[48,55],[40,47],[45,52]];
let musicOn=load('konik.music',true);
const M={playing:false,next:0,step:0,timer:null,bus:null,lp:null,hat:null};
const mtof=n=>440*Math.pow(2,(n-69)/12);
function musicBus(a){if(M.bus)return;M.lp=a.createBiquadFilter();M.lp.type='lowpass';M.lp.frequency.value=18000;M.bus=a.createGain();M.bus.gain.value=0;M.bus.connect(M.lp).connect(a.destination);
  const b=a.createBuffer(1,a.sampleRate*.05,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);M.hat=b}
function voice(a,f,t,len,type,vol){const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.006);g.gain.setTargetAtTime(vol*.55,t+.03,.08);g.gain.setTargetAtTime(0,t+len,.03);o.connect(g).connect(M.bus);o.start(t);o.stop(t+len+.2)}
function hat(a,t,vol){const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=M.hat;f.type='highpass';f.frequency.value=7000;g.gain.value=vol;s.connect(f).connect(g).connect(M.bus);s.start(t)}
function musicTick(){if(!M.playing||!AC)return;const a=AC,bpm=150+Math.max(0,(S.speed-340))*.09,e=60/bpm/2;
  while(M.next<a.currentTime+.25){const st=M.step%64,t=M.next,m=MEL[st],bar=Math.floor(st/8);
    if(m)voice(a,mtof(m[0]),t,m[1]*e*.88,'square',.045);
    if(st%2===0){const pr=BASS[bar];voice(a,mtof(st%4===0?pr[0]:pr[1]),t,e*.9,'triangle',.16)}
    else hat(a,t,.05);
    M.next+=e;M.step++}}
function musicStart(reset){if(!musicOn)return;const a=getAC();if(!a)return;musicBus(a);if(reset)M.step=0;if(M.playing)return;M.playing=true;
  M.next=a.currentTime+.08;M.bus.gain.cancelScheduledValues(a.currentTime);M.bus.gain.setTargetAtTime(.8,a.currentTime,.05);clearInterval(M.timer);M.timer=setInterval(musicTick,40);musicTick()}
function musicStop(){if(!M.playing)return;M.playing=false;clearInterval(M.timer);if(AC&&M.bus){M.bus.gain.cancelScheduledValues(AC.currentTime);M.bus.gain.setTargetAtTime(0,AC.currentTime,.04)}}
function musicWater(on){if(M.lp&&AC)M.lp.frequency.setTargetAtTime(on?850:18000,AC.currentTime,.15)}

/* ---------- state ---------- */
let phase='title',S;
const HS=.72; // horse scale on stage
function newGame(){
  S={t:0,mode:'run',speed:340,dist:0,bonus:0,rings:0,pearls:0,carrots:0,melons:0,seen:{},hearts:3,inv:0,star:0,shake:0,flash:0,combo:0,
    bgCol:SECTION_BG[0].slice(),scroll:0,wscroll:0,nextSpawn:520,

    obs:[],items:[],pits:[],parts:[],banner:null,

newGame();

/* ---------- input ---------- */
let held=false,pressQ=0,releaseQ=0;
function press(){if(!held){held=true;pressQ++}}
function release(){if(held){held=false;releaseQ++}}
const JUMPKEYS=new Set(['Space','ArrowUp','KeyW']);
addEventListener('keydown',e=>{
  if(JUMPKEYS.has(e.code)){e.preventDefault();if(e.repeat)return;
    if(phase==='play')press();else if(phase==='title'||(phase==='over'&&overT>.6))start();else if(phase==='paused')resume();return}
  if(e.code==='Enter'&&(phase==='title'||(phase==='over'&&overT>.6))){e.preventDefault();start()}
  if(e.code==='KeyP'||e.code==='Escape'){if(phase==='play')pause();else if(phase==='paused')resume()}
});
addEventListener('keyup',e=>{if(JUMPKEYS.has(e.code))release()});
cv.addEventListener('pointerdown',e=>{e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}if(phase==='play')press()});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>cv.addEventListener(n,()=>release()));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&phase==='play')pause()});
addEventListener('blur',()=>{if(phase==='play'&&performance.now()>ignoreBlurUntil)pause()});
document.getElementById('fpause').addEventListener('click',()=>{if(phase==='play')pause()});
sndBtn.addEventListener('click',()=>{muted=!muted;save('konik.muted',muted);sndBtn.textContent=muted?'효과음 꺼짐':'효과음 켜짐';if(!muted)sfx('ring')});
sndBtn.textContent=muted?'효과음 꺼짐':'효과음 켜짐';
const bgmBtn=document.getElementById('bgm');bgmBtn.textContent=musicOn?'음악 켜짐':'음악 꺼짐';
bgmBtn.addEventListener('click',()=>{musicOn=!musicOn;save('konik.music',musicOn);bgmBtn.textContent=musicOn?'음악 켜짐':'음악 꺼짐';if(musicOn){if(phase==='play')musicStart(false)}else musicStop()});
pauseBtn.addEventListener('click',()=>{if(phase==='play')pause();else if(phase==='paused')resume()});

/* ---------- overlay ---------- */
function showTitle(){card.innerHTML=`<p class="eyebrow">HUHU TOY CIRCUS</p><h2>KONIK 서커스 런</h2><p>불의 링을 통과하고, 물에 빠지면 부캉이를 만나요</p><button class="go" id="go" type="button">공연 시작</button><p class="hint">${touchMode?'화면을 탭하면 점프 · 시작하면 휴대폰을 가로로 돌려서 플레이하세요':'스페이스 · ↑ · 화면 탭으로 점프'}</p>`;ovl.hidden=false;document.getElementById('go').onclick=start}
let overT=0;
function showOver(){const s=score();card.innerHTML=`<p class="eyebrow">CURTAIN CALL</p><h2>공연 끝!</h2><p class="big">${s.toLocaleString('ko-KR')}점</p><p class="sub">링 ${S.rings} · 당근 ${S.carrots} · 수박 ${S.melons} · 진주 ${S.pearls} · 최고 기록 ${best.toLocaleString('ko-KR')}점</p><div class="row"><button class="go" id="go" type="button">다시 하기</button>${touchMode?'<button class="go ghost" id="quit" type="button">나가기</button>':''}</div>`;ovl.hidden=false;document.getElementById('go').onclick=start;bindQuit()}
function showPause(){card.innerHTML=`<h2>잠시 쉬는 중</h2><div class="row"><button class="go" id="go" type="button">계속하기</button>${touchMode?'<button class="go ghost" id="quit" type="button">나가기</button>':''}</div>`;ovl.hidden=false;document.getElementById('go').onclick=resume;bindQuit()}
function bindQuit(){const q=document.getElementById('quit');if(q)q.onclick=quit}
/* phone: full-screen landscape play */
const touchMode=!!(window.matchMedia&&matchMedia('(pointer: coarse)').matches);
const portraitMQ=window.matchMedia?matchMedia('(orientation: portrait)'):{matches:false};
let ignoreBlurUntil=0,rotPaused=false;
function enterFull(){if(!touchMode)return;document.body.classList.add('playing');ignoreBlurUntil=performance.now()+2000;
  const el=document.documentElement;try{if(el.requestFullscreen&&!document.fullscreenElement)Promise.resolve(el.requestFullscreen({navigationUI:'hide'})).then(()=>{try{return screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')}catch(e){}}).catch(()=>{})}catch(e){}}
function exitFull(){document.body.classList.remove('playing');try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{})}catch(e){}try{screen.orientation&&screen.orientation.unlock&&screen.orientation.unlock()}catch(e){}}
function quit(){musicStop();exitFull();newGame();phase='title';rotPaused=false;showTitle();pauseBtn.textContent='일시정지'}
function onOrient(){if(!document.body.classList.contains('playing'))return;
  if(portraitMQ.matches){if(phase==='play'){pause();rotPaused=true}}
  else if(rotPaused&&phase==='paused'){rotPaused=false;setTimeout(()=>{if(phase==='paused'&&!portraitMQ.matches)resume()},500)}}

function start(){getAC();enterFull();newGame();rotPaused=false;musicStart(true);musicWater(false);phase='play';ovl.hidden=true;held=false;pressQ=releaseQ=0;cv.focus&&cv.focus();pauseBtn.textContent='일시정지'}
function pause(){phase='paused';musicStop();held=false;showPause();pauseBtn.textContent='계속하기'}
function resume(){phase='play';musicStart(false);ovl.hidden=true;held=false;pressQ=releaseQ=0;last=performance.now();pauseBtn.textContent='일시정지'}
function gameOver(){phase='over';musicStop();overT=0;const s=score();if(s>best){best=s;save('konik.best',best);bestEl.textContent=best}sfx('over');setTimeout(()=>{if(phase==='over')showOver()},650)}
const score=()=>Math.max(0,Math.floor(S.dist/10)+S.bonus);

/* ---------- particles & text ---------- */
function burst(x,y,n,colors,sp=220,type='dot'){for(let i=0;i<n;i++){const a=rand(0,Math.PI*2),v=rand(sp*.3,sp);S.parts.push({type,x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-sp*.3,life:rand(.4,.8),max:.8,c:colors[i%colors.length],s:rand(3,7),r:rand(0,6),vr:rand(-8,8)})}}
function floatText(text,x,y,c='#fff4e6'){S.parts.push({type:'text',text,x,y,vx:0,vy:-60,life:1,max:1,c})}
function banner(text,dur=1.6){S.banner={text,t:0,dur}}

/* ---------- spawning (stage) ---------- */
function pick(pool){const tot=pool.reduce((a,b)=>a+b[1],0);let r=Math.random()*tot;for(const[k,w]of pool){if((r-=w)<=0)return k}return pool[0][0]}
function ringArc(x0,n,h){const top=Math.floor(n/2),carrot=Math.random()<.22;for(let i=0;i<n;i++)S.items.push({type:carrot&&i===top?'carrot':'ring',x:x0+i*42,y:GROUND-48-Math.sin((i+.5)/n*Math.PI)*h})}
function spawnRun(){
  const x=W+50,pool=[['drum',20],['ball',12],['fire',18],['pit',16],['arc',8],['snail',9],['carrot',5],['melon',3]];
  if(S.dist>500)pool.push(['wolf',13]);
  if(S.dist>1000)pool.push(['lion',11]);
  if(S.dist>1500)pool.push(['tower',12]);
  if(S.star<=0&&S.dist>1600)pool.push(['star',4]);
  if(S.hearts<3)pool.push(['heart',3]);
  let extra=0;
  switch(pick(pool)){
    case'drum':S.obs.push({type:'drum',x,w:56,h:46});ringArc(x-56,4,92);break;
    case'tower':S.obs.push({type:'tower',x,w:50,h:104});ringArc(x-60,4,150);break;
    case'ball':S.obs.push({type:'ball',x:x+30,r:24,rot:0,vx:120});break;
    case'fire':{const o={type:'fire',x:x+30,cy:GROUND-146,ry:78,rx:15};S.obs.push(o);S.items.push({type:'ring',x:o.x-90,y:o.cy+30},{type:'ring',x:o.x-45,y:o.cy+10},{type:'ring',x:o.x,y:o.cy});break}
    case'pit':{const w=rand(150,200)+Math.min(40,(S.speed-340)*.12);S.pits.push({x,w});ringArc(x+w/2-84,5,110);extra=w;break}
    case'arc':ringArc(x,5,rand(40,120));break;
    case'star':S.items.push({type:'star',x,y:GROUND-160});break;
    case'heart':S.items.push({type:'heart',x,y:GROUND-140});break;
    case'lion':S.obs.push({type:'lion',enemy:1,x,w:92,h:64,vx:40,ph:0,hb:[10,82,-60]});ringArc(x-60,5,140);break;
    case'wolf':S.obs.push({type:'wolf',enemy:1,x:x+80,w:96,h:50,vx:150,ph:0,hb:[8,88,-50]});break;
    case'snail':S.obs.push({type:'snail',enemy:1,x,w:56,h:36,vx:25,ph:0,hb:[4,52,-34]});break;
    case'carrot':S.items.push({type:'carrot',x,y:GROUND-110},{type:'carrot',x:x+60,y:GROUND-150});break;
    case'melon':S.items.push({type:'melon',x,y:GROUND-200});ringArc(x-84,5,150);break;
  }
  S.nextSpawn=rand(380,620)*(.85+S.speed/1600)+extra;
}

/* ---------- spawning (sea) ---------- */
function spawnSea(){
  const w=S.w,x=W+70;
  switch(pick([['jelly',30],['rock',24],['net',22],['pearls',24]])){
    case'jelly':{const y=rand(180,420);w.obs.push({type:'jelly',x,y0:y,ph:rand(0,6),r:22});if(Math.random()<.4)w.obs.push({type:'jelly',x:x+130,y0:clamp(y+rand(-160,160),170,430),ph:rand(0,6),r:22});break}
    case'rock':{const h=rand(120,215),ww=rand(80,110);w.obs.push({type:'rock',x,w:ww,top:FLOOR-h});for(let i=0;i<4;i++)w.items.push({type:'pearl',x:x-40+i*50,y:FLOOR-h-70-Math.sin(i/3*Math.PI)*30});break}
    case'net':{const h=rand(150,230);w.obs.push({type:'net',x,w:72,bottom:SURF+h});for(let i=0;i<4;i++)w.items.push({type:'pearl',x:x-30+i*45,y:SURF+h+90});break}
    case'pearls':{const y=rand(200,400);for(let i=0;i<6;i++)w.items.push({type:'pearl',x:x+i*44,y:y+Math.sin(i*.9)*50});break}
  }
  w.next=rand(1.05,1.5);
}

/* ---------- collisions ---------- */
function horseBox(){const p=S.p;return{x1:p.x+16*HS,x2:p.x+80*HS,y1:p.y-96*HS,y2:p.y-3}}
const boxHit=(a,b)=>a.x1<b.x2&&a.x2>b.x1&&a.y1<b.y2&&a.y2>b.y1;
function circBox(cx,cy,r,b){const nx=clamp(cx,b.x1,b.x2),ny=clamp(cy,b.y1,b.y2);return(cx-nx)**2+(cy-ny)**2<r*r}
function hurt(o){
  if(S.star>0){smash(o);return}
  if(S.inv>0)return;
  S.hearts--;S.inv=1.6;S.shake=.35;S.combo=0;sfx('hit');
  const hb=S.mode==='run'?horseBox():{x1:S.w.sx-40,x2:S.w.sx+40,y1:S.w.sy-40,y2:S.w.sy+40};
  burst((hb.x1+hb.x2)/2,(hb.y1+hb.y2)/2,14,['#fff4e6','#ff5b6e','#f2c14e']);
  if(S.hearts<=0)gameOver();
}
function smash(o){if(o.dead)return;o.dead=true;S.bonus+=30;sfx('smash');const cx=o.x+(o.w||0)/2,cy=o.type==='ball'?GROUND-o.r:o.top!=null?(o.top+FLOOR)/2:o.bottom?(SURF+o.bottom)/2:o.y0||GROUND-(o.h||40)/2;burst(cx,cy,18,['#f2c14e','#d94a5f','#2f5fae','#fff4e6','#4f9d5b'],320,'debris');floatText('+30',cx,cy-30,'#f2c14e')}
function collect(it){
  it.dead=true;
  if(it.type==='ring'){S.rings++;S.bonus+=10;sfx('ring');burst(it.x,it.y,6,['#f2c14e','#fff2b0'],120)}
  else if(it.type==='carrot'){S.carrots++;S.bonus+=30;sfx('crunch');floatText('+30',it.x,it.y-22,'#ffb15a');burst(it.x,it.y,8,['#ef8a2c','#4f9d5b'],140)}
  else if(it.type==='melon'){S.melons++;S.bonus+=60;sfx('melon');floatText('+60',it.x,it.y-26,'#ff8fa3');burst(it.x,it.y,12,['#e2475d','#4f9d5b','#1c1418'],180)}
  else if(it.type==='pearl'){S.pearls++;S.bonus+=20;sfx('pearl');burst(it.x,it.y,6,['#ffffff','#cfe8ff'],110)}
  else if(it.type==='star'){S.star=6;sfx('star');banner('무지개 무적!',1.3);burst(it.x,it.y,24,['#ff5b6e','#f2c14e','#4f9d5b','#2f74c9','#9a88cc'],300,'star')}
  else if(it.type==='heart'){S.hearts=Math.min(3,S.hearts+1);sfx('heart');floatText('하트 +1',it.x,it.y-20,'#ff8fa3')}
}

/* ---------- update ---------- */
const G=2600,JUMP=830,DJUMP=740;
function update(dt){
  S.t+=dt;S.inv=Math.max(0,S.inv-dt);S.star=Math.max(0,S.star-dt);S.shake=Math.max(0,S.shake-dt);S.flash=Math.max(0,S.flash-dt*2.2);
  if(S.banner){S.banner.t+=dt;if(S.banner.t>S.banner.dur)S.banner=null}
  const presses=pressQ,releases=releaseQ;pressQ=releaseQ=0;
  if(S.mode==='run')updateRun(dt,presses,releases);else updateSea(dt);
  for(const q of S.parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.type!=='text'&&q.type!=='bubble')q.vy+=900*dt;if(q.type==='bubble'){q.vy-=40*dt;q.x+=Math.sin(S.t*4+q.r)*20*dt}q.r+=(q.vr||0)*dt}
  S.parts=S.parts.filter(q=>q.life>0);
  const target=SECTION_BG[Math.floor(S.dist/4200)%3];S.bgCol=mix(S.bgCol,target,Math.min(1,dt*1.2));
}
function updateRun(dt,presses,releases){
  const p=S.p;
  S.speed=Math.min(640,340+S.dist*.011);const sp=S.speed*(S.star>0?1.12:1);
  S.dist+=sp*dt;S.scroll+=sp*dt;
  p.buffer-=dt;p.coyote-=dt;
  if(presses){if(p.onGround||p.coyote>0)p.buffer=.12;else if(p.jumps<2){p.vy=-DJUMP;p.jumps=2;sfx('dj');burst(p.x+40*HS,p.y,8,['#fff4e6'],120)}else p.buffer=.12}
  if(p.buffer>0&&(p.onGround||p.coyote>0)){p.vy=-JUMP;p.onGround=false;p.coyote=0;p.jumps=1;p.buffer=0;sfx('jump')}
  if(releases&&p.vy<-200)p.vy*=.5;
  const prevY=p.y;p.vy+=G*dt;p.y+=p.vy*dt;
  const fx1=p.x+18*HS,fx2=p.x+78*HS,overPit=S.pits.some(q=>fx1>q.x+4&&fx2<q.x+q.w-4);
  if(!overPit&&p.y>=GROUND&&prevY<=GROUND+2&&p.vy>=0){if(!p.onGround)burst(p.x+46*HS,GROUND,5,['rgba(255,244,230,.9)'],90);p.y=GROUND;p.vy=0;p.onGround=true;p.jumps=0;

}

  c.strokeStyle='#c76a98';c.lineWidth=3;c.beginPath();for(let a=0;a<Math.PI*4.2;a+=.2){const r=2+a*1.15;c.lineTo(22+Math.cos(a+o.ph*.2)*r,-24+Math.sin(a+o.ph*.2)*r)}c.stroke();
  c.fillStyle='rgba(255,255,255,.35)';c.beginPath();c.ellipse(15,-34,6,3,-.6,0,7);c.fill()}
function drawEnemy(o){ctx.save();ctx.translate(o.x+o.w,GROUND);ctx.scale(-1,1);if(o.squash)ctx.scale(1,.35);
  ({lion:drawLion,wolf:drawWolf,snail:drawSnail})[o.type](ctx,o);ctx.restore()}
function drawObs(o){
  ctx.save();
  if(o.dead){ctx.globalAlpha=Math.max(0,1-(o.dy||0)*(o.squash?1.6:3));if(ctx.globalAlpha<=0){o.gone=true;ctx.restore();return}}
  if(o.type==='drum')drawDrumShape(o.x,GROUND-o.h,o.w,o.h,'#f4c95d','#d94a5f','#fff4e6');
  else if(o.type==='tower'){drawDrumShape(o.x,GROUND-54,o.w,54,'#2f5fae','#f2c14e','#cfe0ff');drawDrumShape(o.x+4,GROUND-o.h,o.w-8,52,'#d94a5f','#fff4e6','#ffd3dc');ctx.fillStyle='#f2c14e';starPath(ctx,o.x+o.w/2,GROUND-26,9,4);ctx.fill()}
  else if(o.enemy)drawEnemy(o);
  else if(o.type==='ball'){const cy=GROUND-o.r;ctx.save();ctx.translate(o.x,cy);ctx.rotate(o.rot);const cols=['#d94a5f','#fff4e6','#2f5fae','#f2c14e'];for(let i=0;i<4;i++){ctx.fillStyle=cols[i];ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,o.r,i*Math.PI/2,(i+1)*Math.PI/2);ctx.fill()}ctx.restore();
    ctx.fillStyle='rgba(255,255,255,.45)';ctx.beginPath();ctx.ellipse(o.x-8,cy-9,7,4,-.6,0,7);ctx.fill();ctx.fillStyle='rgba(60,20,50,.2)';ctx.beginPath();ctx.ellipse(o.x,GROUND+2,o.r*.9,4,0,0,7);ctx.fill()}
  ctx.restore();
}
function flame(x,y,s,k){const f=s+Math.sin(S.t*16+k*1.7)*3;ctx.fillStyle='#ff6a3d';ctx.beginPath();ctx.moveTo(x-f*.55,y);ctx.quadraticCurveTo(x,y-f*2.1,x+f*.55,y);ctx.arc(x,y,f*.55,0,Math.PI);ctx.fill();ctx.fillStyle='#ffd25a';ctx.beginPath();ctx.moveTo(x-f*.3,y);ctx.quadraticCurveTo(x,y-f*1.2,x+f*.3,y);ctx.arc(x,y,f*.3,0,Math.PI);ctx.fill()}
function drawFire(o,front){
  const N=16;
  if(!front){ctx.strokeStyle='#6b3a2a';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(o.x,0);ctx.lineTo(o.x,o.cy-o.ry);ctx.stroke();
    const rg=ctx.createRadialGradient(o.x,o.cy,10,o.x,o.cy,o.ry*1.3);rg.addColorStop(0,'rgba(255,190,80,0)');rg.addColorStop(.7,'rgba(255,160,60,.18)');rg.addColorStop(1,'rgba(255,160,60,0)');ctx.fillStyle=rg;ctx.fillRect(o.x-o.ry*1.3,o.cy-o.ry*1.3,o.ry*2.6,o.ry*2.6)}
  ctx.lineWidth=11;ctx.strokeStyle=front?'#f6b73c':'#c97a24';ctx.beginPath();
  if(front)ctx.ellipse(o.x,o.cy,o.rx,o.ry,0,-Math.PI/2,Math.PI/2);else ctx.ellipse(o.x,o.cy,o.rx,o.ry,0,Math.PI/2,Math.PI*1.5);ctx.stroke();
  if(front){ctx.lineWidth=3;ctx.strokeStyle='#fff0b8';ctx.beginPath();ctx.ellipse(o.x+2,o.cy,o.rx,o.ry-3,0,-Math.PI/2.4,Math.PI/2.4);ctx.stroke()}
  for(let k=0;k<N;k++){const a=k/N*Math.PI*2,c=Math.cos(a);if((c>=0)!==front)continue;const px=o.x+c*(o.rx+4),py=o.cy+Math.sin(a)*(o.ry+4);flame(px,py,o.hit?5:9,k)}
}
function drawItem(it){
  const t=S.t;
  if(it.type==='ring'){ctx.save();ctx.translate(it.x,it.y+Math.sin(t*4+it.x*.02)*2);ctx.scale(Math.max(.22,Math.abs(Math.cos(t*3+it.x*.013))),1);ctx.lineWidth=5;ctx.strokeStyle='#e9b13a';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.stroke();ctx.lineWidth=2;ctx.strokeStyle='#fff2b0';ctx.beginPath();ctx.arc(0,0,12,-2.4,-1.2);ctx.stroke();ctx.restore()}
  else if(it.type==='carrot'){const y=it.y+Math.sin(t*4+it.x*.02)*3;ctx.save();ctx.translate(it.x,y);ctx.rotate(.5+Math.sin(t*3)*.12);
    ctx.fillStyle='#4f9d5b';for(const a of[-.45,0,.45]){ctx.save();ctx.rotate(a);ctx.beginPath();ctx.ellipse(0,-20,3.5,9,0,0,7);ctx.fill();ctx.restore()}
    ctx.fillStyle='#ef8a2c';ctx.beginPath();ctx.moveTo(-9,-11);ctx.quadraticCurveTo(0,-15,9,-11);ctx.lineTo(1,20);ctx.lineTo(-1,20);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(150,60,10,.45)';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(-6,-3);ctx.lineTo(-1,-2);ctx.moveTo(3,5);ctx.lineTo(6,4);ctx.moveTo(-3,11);ctx.lineTo(1,11);ctx.stroke();ctx.restore()}
  else if(it.type==='melon'){const y=it.y+Math.sin(t*3)*5;ctx.save();ctx.translate(it.x,y);ctx.rotate(Math.sin(t*2)*.15);
    ctx.fillStyle='rgba(255,180,190,.35)';ctx.beginPath();ctx.arc(0,-4,30,0,7);ctx.fill();
    ctx.fillStyle='#3f8f4a';ctx.beginPath();ctx.arc(0,-8,24,0,Math.PI);ctx.closePath();ctx.fill();
    ctx.fillStyle='#bfe6a6';ctx.beginPath();ctx.arc(0,-8,20,0,Math.PI);ctx.closePath();ctx.fill();
    ctx.fillStyle='#e2475d';ctx.beginPath();ctx.arc(0,-8,17,0,Math.PI);ctx.closePath();ctx.fill();
    ctx.fillStyle='#1c1418';for(const[sx,sy]of[[-8,-3],[0,1],[8,-3],[-4,4],[4,4]]){ctx.beginPath();ctx.ellipse(sx,sy,1.6,2.6,0,0,7);ctx.fill()}ctx.restore()}
  else if(it.type==='pearl'){const g=ctx.createRadialGradient(it.x-3,it.y-3,1,it.x,it.y,11);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#bcd6ef');ctx.fillStyle='rgba(255,255,255,.25)';ctx.beginPath();ctx.arc(it.x,it.y,15+Math.sin(t*5+it.x)*2,0,7);ctx.fill();ctx.fillStyle=g;ctx.beginPath();ctx.arc(it.x,it.y,9,0,7);ctx.fill()}
  else if(it.type==='star'){const y=it.y+Math.sin(t*3)*8;ctx.save();ctx.translate(it.x,y);ctx.rotate(Math.sin(t*2)*.3);ctx.fillStyle='rgba(255,240,170,.35)';ctx.beginPath();ctx.arc(0,0,30,0,7);ctx.fill();starPath(ctx,0,0,22,10);ctx.fillStyle='#ffd54a';ctx.fill();ctx.lineWidth=4;ctx.strokeStyle=`hsl(${t*300%360},90%,60%)`;ctx.stroke();ctx.restore()}
  else if(it.type==='heart'){const y=it.y+Math.sin(t*3)*6;heartPath(it.x,y,15);ctx.fillStyle='#ff5b6e';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='#fff4e6';ctx.stroke()}
}
function heartPath(x,y,s){ctx.beginPath();ctx.moveTo(x,y+s*.9);ctx.bezierCurveTo(x-s*1.4,y,x-s*.9,y-s*1.1,x,y-s*.35);ctx.bezierCurveTo(x+s*.9,y-s*1.1,x+s*1.4,y,x,y+s*.9);ctx.closePath()}
function drawPlayerRun(){
  const p=S.p,blink=S.inv>0&&Math.floor(S.t*14)%2===0;
  const sh=clamp(1-(GROUND-p.y)/260,.3,1);if(p.y<=GROUND+2){ctx.fillStyle=`rgba(60,20,50,${.22*sh})`;ctx.beginPath();ctx.ellipse(p.x+48*HS,GROUND+3,32*sh,5*sh,0,0,7);ctx.fill()}
  const bob=p.onGround?-Math.abs(Math.sin(p.legPh))*4:0;
  drawHorse(ctx,p.x,p.y+bob,HS,S.star>0?'stripe':skin,p.rock,{alpha:blink?.35:1,glow:S.star>0?(S.t*400)%360:null,legs:p.legs});
}

/* ---------- drawing: sea ---------- */
function drawSea(){
  const t=S.t,ws=S.wscroll;
  const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#5fd0e3');g.addColorStop(.55,'#2b93bf');g.addColorStop(1,'#1a5a8c');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.08)';for(let i=0;i<5;i++){const x=((i*230-ws*.15)%(W+300)+W+300)%(W+300)-150+Math.sin(t*.7+i)*30;ctx.beginPath();ctx.moveTo(x,SURF);ctx.lineTo(x+60,SURF);ctx.lineTo(x+200,H);ctx.lineTo(x+60,H);ctx.closePath();ctx.fill()}
  ctx.fillStyle='#bff0fa';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,SURF);for(let x=0;x<=W;x+=12)ctx.lineTo(x,SURF+Math.sin(x*.03+t*3)*4);ctx.lineTo(W,0);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();for(let x=0;x<=W;x+=12)ctx.lineTo(x,SURF+Math.sin(x*.03+t*3)*4+3);ctx.lineTo(W,SURF-2);ctx.lineTo(0,SURF-2);ctx.closePath();ctx.fill();
  // far kelp
  for(let i=0;i<9;i++){const x=((i*140-ws*.35)%(W+140)+W+140)%(W+140)-70;ctx.strokeStyle=i%2?'rgba(40,120,110,.5)':'rgba(30,100,120,.45)';ctx.lineWidth=7;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,FLOOR+10);for(let k=1;k<=6;k++)ctx.lineTo(x+Math.sin(t*1.6+k*.8+i)*10,FLOOR+10-k*(26+i%3*8));ctx.stroke()}
  // sand
  ctx.fillStyle='#e9d39b';ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=20)ctx.lineTo(x,FLOOR+Math.sin((x+ws)*.02)*4);ctx.lineTo(W,H);ctx.closePath();ctx.fill();
  ctx.fillStyle='rgba(200,160,90,.5)';for(let x=-(ws%70);x<W;x+=70){ctx.beginPath();ctx.ellipse(x+20,FLOOR+18,10,2,0,0,7);ctx.fill()}
}
function drawSeaObs(o){
  const t=S.t;
  if(o.type==='jelly'){const y=o.y0+Math.sin(t*2+o.ph)*46;
    ctx.strokeStyle='rgba(247,160,200,.8)';ctx.lineWidth=3;for(let k=0;k<4;k++){const x=o.x-14+k*9.5;ctx.beginPath();ctx.moveTo(x,y);for(let j=1;j<=5;j++)ctx.lineTo(x+Math.sin(t*5+j+k)*4,y+j*9);ctx.stroke()}
    ctx.fillStyle='rgba(255,180,215,.25)';ctx.beginPath();ctx.arc(o.x,y-6,o.r+10,0,7);ctx.fill();
    ctx.fillStyle='#f7a3c8';ctx.beginPath();ctx.arc(o.x,y,o.r,Math.PI,0);ctx.quadraticCurveTo(o.x+o.r*.5,y+8,o.x,y+3);ctx.quadraticCurveTo(o.x-o.r*.5,y+8,o.x-o.r,y);ctx.fill();
    ctx.fillStyle='#3a1530';ctx.beginPath();ctx.arc(o.x-7,y-6,2.4,0,7);ctx.arc(o.x+7,y-6,2.4,0,7);ctx.fill();ctx.fillStyle='rgba(255,255,255,.5)';ctx.beginPath();ctx.ellipse(o.x-8,y-14,6,3,-.5,0,7);ctx.fill()}
  else if(o.type==='rock'){const x=o.x,w=o.w,top=o.top;ctx.fillStyle='#5f6f97';ctx.beginPath();ctx.moveTo(x,FLOOR+20);ctx.lineTo(x+4,top+30);ctx.quadraticCurveTo(x+6,top,x+w*.4,top+4);ctx.quadraticCurveTo(x+w*.7,top-6,x+w-6,top+22);ctx.lineTo(x+w,FLOOR+20);ctx.closePath();ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(x+10,top+20,8,FLOOR-top-20);
    ctx.strokeStyle='#ff8fa3';ctx.lineWidth=5;ctx.lineCap='round';for(let k=0;k<3;k++){const bx=x+w*.25+k*w*.25;ctx.beginPath();ctx.moveTo(bx,top+8);ctx.lineTo(bx+Math.sin(t*2+k)*3,top-16);ctx.moveTo(bx,top-4);ctx.lineTo(bx-8,top-12);ctx.moveTo(bx,top-8);ctx.lineTo(bx+8,top-18);ctx.stroke()}}
  else if(o.type==='net'){const x=o.x,w=o.w,b=o.bottom;ctx.strokeStyle='rgba(120,80,40,.85)';ctx.lineWidth=2;
    for(let xx=x;xx<=x+w;xx+=12){ctx.beginPath();ctx.moveTo(xx,SURF);ctx.lineTo(xx+Math.sin(t*2+xx)*2,b);ctx.stroke()}
    for(let yy=SURF+14;yy<b;yy+=16){ctx.beginPath();ctx.moveTo(x,yy);ctx.quadraticCurveTo(x+w/2,yy+5,x+w,yy);ctx.stroke()}
    ctx.lineWidth=4;ctx.strokeStyle='#8a5a2a';ctx.beginPath();ctx.moveTo(x-4,b);ctx.quadraticCurveTo(x+w/2,b+8,x+w+4,b);ctx.stroke();
    for(let k=0;k<3;k++){const bx=x+k*w/2;ctx.fillStyle=k%2?'#fff4e6':'#e2475d';ctx.beginPath();ctx.arc(bx,SURF+2,8,0,7);ctx.fill()}}
}
function drawRiderShark(){
  const w=S.w,blink=S.inv>0&&Math.floor(S.t*14)%2===0,rot=clamp(w.vy*.0006,-.25,.25),bob=Math.sin(S.t*3)*3;
  ctx.save();if(blink)ctx.globalAlpha=.4;
  const k=S.star>0?'stripe':skin,glow=S.star>0?(S.t*400)%360:null;
  if(S.mode==='dive'&&!w.rider){drawShark(ctx,w.sx,w.sy,.75,S.t,0,null);drawHorse(ctx,w.kx-30,w.ky,.56,k,Math.sin(S.t*6)*.3,{glow,legs:gait(S.t*16,1.2)})}
  else drawShark(ctx,w.sx,w.sy+bob,.75,S.t,rot,c=>{drawHorse(c,-8,-24,.74,k,Math.sin(S.t*8)*.04,{glow,legs:gait(S.t*9,.7)})});
  ctx.restore();
}

/* ---------- HUD ---------- */
function outlined(text,x,y,size,align='left',fill='#fff4e6'){ctx.font=`${size}px ${FONT}`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.lineJoin='round';ctx.lineWidth=size*.22;ctx.strokeStyle='rgba(43,18,46,.75)';ctx.strokeText(text,x,y);ctx.fillStyle=fill;ctx.fillText(text,x,y)}
function drawHUD(){
  const top=S.mode==='run'?52:30;
  for(let i=0;i<3;i++){heartPath(34+i*36,top,13);ctx.fillStyle=i<S.hearts?'#ff5b6e':'rgba(255,255,255,.3)';ctx.fill();ctx.lineWidth=3;ctx.strokeStyle='rgba(43,18,46,.6)';ctx.stroke()}
  ctx.lineWidth=5;ctx.strokeStyle='#e9b13a';ctx.beginPath();ctx.arc(160,top,10,0,7);ctx.stroke();outlined(String(S.rings),178,top+1,24);
  ctx.fillStyle='#eef6ff';ctx.beginPath();ctx.arc(244,top,9,0,7);ctx.fill();outlined(String(S.pearls),260,top+1,24);
  ctx.fillStyle='#ef8a2c';ctx.beginPath();ctx.moveTo(320,top-8);ctx.lineTo(332,top-8);ctx.lineTo(326,top+11);ctx.closePath();ctx.fill();ctx.fillStyle='#4f9d5b';ctx.fillRect(323,top-14,6,6);outlined(String(S.carrots),340,top+1,24);
  ctx.fillStyle='#3f8f4a';ctx.beginPath();ctx.arc(408,top-4,12,0,Math.PI);ctx.closePath();ctx.fill();ctx.fillStyle='#e2475d';ctx.beginPath();ctx.arc(408,top-4,9,0,Math.PI);ctx.closePath();ctx.fill();outlined(String(S.melons),426,top+1,24);
  outlined(score().toLocaleString('ko-KR'),W-24,top+1,32,'right');
  if(S.star>0){ctx.fillStyle='rgba(43,18,46,.45)';ctx.fillRect(20,top+22,140,8);ctx.fillStyle=`hsl(${S.t*400%360},90%,62%)`;ctx.fillRect(20,top+22,140*S.star/6,8)}
  if(S.mode==='swim'){const left=Math.max(0,15.5-S.w.t);ctx.fillStyle='rgba(43,18,46,.35)';ctx.fillRect(W/2-90,top-5,180,10);ctx.fillStyle='#bff0fa';ctx.fillRect(W/2-90,top-5,180*left/15.5,10);outlined('부캉이와 헤엄 중',W/2,top+22,18,'center')}
  if(S.combo>1&&S.mode==='run')outlined(`콤보 ×${S.combo}`,W-24,top+34,20,'right','#ffe27a');
}
function drawParts(){
  for(const q of S.parts){const a=clamp(q.life/q.max,0,1);ctx.globalAlpha=a;
    if(q.type==='text'){outlined(q.text,q.x,q.y,24,'center',q.c)}
    else if(q.type==='star'){ctx.fillStyle=q.c;starPath(ctx,q.x,q.y,q.s*1.6,q.s*.7);ctx.fill()}
    else if(q.type==='bubble'){ctx.strokeStyle=q.c;ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(q.x,q.y,q.s,0,7);ctx.stroke()}
    else if(q.type==='debris'){ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.fillStyle=q.c;ctx.fillRect(-q.s,-q.s/2,q.s*2,q.s);ctx.restore()}
    else{ctx.fillStyle=q.c;ctx.beginPath();ctx.arc(q.x,q.y,q.s*a,0,7);ctx.fill()}}
  ctx.globalAlpha=1;
}
function drawBanner(){const b=S.banner;if(!b)return;const k=b.t/b.dur,s=k<.15?.6+k/.15*.4:1,a=k>.75?(1-k)/.25:1;ctx.save();ctx.globalAlpha=a;ctx.translate(W/2,H*.3);ctx.scale(s,s);outlined(b.text,0,0,54,'center','#ffe27a');ctx.restore()}

/* ---------- frame ---------- */
function render(){
  ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0);
  ctx.save();
  if(S.shake>0&&!reduceMotion)ctx.translate(rand(-6,6)*S.shake*3,rand(-6,6)*S.shake*3);
  if(S.mode==='run'){
    drawStage();
    for(const o of S.obs)if(o.type==='fire')drawFire(o,false);
    for(const o of S.obs)if(o.type!=='fire')drawObs(o);
    for(const it of S.items)drawItem(it);
    drawPlayerRun();
    for(const o of S.obs)if(o.type==='fire')drawFire(o,true);
  }else{
    drawSea();
    for(const o of S.w.obs)drawSeaObs(o);
    for(const it of S.w.items)drawItem(it);
    drawRiderShark();
  }
  drawParts();
  ctx.restore();
  if(phase!=='title')drawHUD();
  drawBanner();
  if(S.flash>0){ctx.fillStyle=`rgba(235,250,255,${S.flash*.85})`;ctx.fillRect(0,0,W,H)}
}
let last=performance.now();
function loop(now){
  const dt=Math.min(.033,(now-last)/1000);last=now;
  if(phase==='play')update(dt);
  else if(phase==='title'){S.t+=dt;S.scroll+=120*dt;S.p.legPh+=dt*7;S.p.rock=Math.sin(S.p.legPh)*.03;S.p.onGround=true;S.p.legs=gait(S.p.legPh,.55);S.bgCol=mix(S.bgCol,hex(SKINS[skin].bg),Math.min(1,dt*3))}
  else if(phase==='over'){overT+=dt;S.t+=dt*.3;for(const q of S.parts){q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt}}
  {const uw=S.mode!=='run';if(uw!==M.uw){M.uw=uw;musicWater(uw)}}
  render();
  requestAnimationFrame(loop);
}

/* ---------- sizing ---------- */
function resize(){const r=cv.getBoundingClientRect(),d=Math.min(2,window.devicePixelRatio||1);cv.width=Math.max(1,Math.round(r.width*d));cv.height=Math.max(1,Math.round(r.height*d))}
new ResizeObserver(resize).observe(cv);resize();

/* ---------- skin picker ---------- */
const skinsEl=document.getElementById('skins');
for(const key of Object.keys(SKINS)){
  const b=document.createElement('button');b.type='button';b.className='skin';b.id='skin-'+key;b.setAttribute('aria-pressed',String(key===skin));
  const c=document.createElement('canvas');c.width=156;c.height=112;const x=c.getContext('2d');x.fillStyle=SKINS[key].bg;x.fillRect(0,0,156,112);drawHorse(x,30,104,.9,key);
  b.append(c,document.createTextNode(SKINS[key].name));
  b.addEventListener('click',()=>{skin=key;save('konik.skin',skin);skinsEl.querySelectorAll('.skin').forEach(s=>s.setAttribute('aria-pressed',String(s===b)));b.blur()});
  skinsEl.append(b);
}
if(!SKINS[skin])skin='patch';
showTitle();
requestAnimationFrame(loop);
})();
</script>
